name = "solarprognose-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Eigene Domain statt workers.dev: Der Zwischenspeicher (Cache API) funktioniert nur dort.
# Der Name muss in der Cloudflare-Zone autoknigge.de frei sein.
routes = [
  { pattern = "solar-api.autoknigge.de", custom_domain = true }
]

# Hintergrundlauf: hält die Energy-Charts-Reihen frisch, damit die App sofort Daten bekommt.
[triggers]
crons = ["*/7 * * * *"]

# Dauerhafter Speicher. Die ID trägt der Workflow beim Veröffentlichen ein (legt den Speicher bei Bedarf an).
[[kv_namespaces]]
binding = "CACHE"
id = "KV_ID_PLATZHALTER"
