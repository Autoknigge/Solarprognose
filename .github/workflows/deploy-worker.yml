name: Worker veröffentlichen

# Spielt worker/ bei Cloudflare ein und setzt die beiden Worker-Secrets neu.
# Läuft nur auf Knopfdruck: Actions → Worker veröffentlichen → Run workflow.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node worker/test/test.mjs

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            APP_TOKEN
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}

      # Nur wenn ein bezahlter Open-Meteo-Schlüssel hinterlegt ist; sonst nutzt der Worker die kostenlose Schnittstelle.
      - name: Open-Meteo-Schlüssel setzen
        if: ${{ env.OPEN_METEO_API_KEY != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            OPEN_METEO_API_KEY
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
