name: Worker veröffentlichen

# Spielt worker/ bei Cloudflare ein und setzt die beiden Worker-Secrets neu.
# Läuft nur auf Knopfdruck: Actions → Worker veröffentlichen → Run workflow.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node worker/test/test.mjs

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            OPEN_METEO_API_KEY
            APP_TOKEN
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
